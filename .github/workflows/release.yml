name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm pack --dry-run
      - name: Verify release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          node -e "const { version } = require('./package.json');
          if (process.env.RELEASE_TAG !== 'v' + version)
          throw new Error('Release tag must be v' + version);"

  publish:
    needs: verify
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/search1api-mcp
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - name: Publish package
        run: |
          PACKAGE_SPEC=$(node -p "const packageJson = require('./package.json'); packageJson.name + '@' + packageJson.version")
          if npm view "$PACKAGE_SPEC" version >/dev/null 2>&1; then
            echo "$PACKAGE_SPEC is already published"
          else
            npm publish
          fi

  # Needs the npm package to exist first, so it can verify the published
  # version matches the manifests. Chained after publish (which itself waits
  # on the npm environment approval), it can no longer race the npm release
  # the way the old standalone mcp-registry.yml did. A skipped publish means
  # a workflow_dispatch re-sync: run it as long as verify passed.
  registry:
    needs: [verify, publish]
    if: >-
      !cancelled() &&
      needs.verify.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Verify release metadata and npm package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          SERVER_VERSION=$(node -p "require('./server.json').version")
          NPM_VERSION=$(npm view "search1api-mcp@$PACKAGE_VERSION" version)

          test "$SERVER_VERSION" = "$PACKAGE_VERSION"
          test "$NPM_VERSION" = "$PACKAGE_VERSION"

          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            test "$RELEASE_TAG" = "v$PACKAGE_VERSION"
          fi

      - name: Check whether this version is already in the Registry
        id: registry_state
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./server.json').name")
          # The Registry rejects a duplicate version with a 400, so a manual
          # re-sync of an already-published version must skip instead of fail.
          # If the versions API itself is unreachable, fall through to publish
          # and let the Registry decide -- an outage must not block a new
          # release.
          VERSIONS=$(curl -fsSL \
            "https://registry.modelcontextprotocol.io/v0/servers/${NAME//\//%2F}/versions" \
            2>/dev/null || echo "")
          if [ -n "$VERSIONS" ] && echo "$VERSIONS" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const j=JSON.parse(d);const want=process.argv[1];process.exit((j.servers||[]).some((s)=>s.server&&s.server.version===want)?0:1)})" "$VERSION"; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is already in the MCP Registry; skipping publish"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pinned mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.0
          MCP_PUBLISHER_SHA256: 1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf
        run: |
          set -euo pipefail
          curl -fsSLo mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum --check
          tar xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher

      - name: Validate Registry metadata
        run: ./mcp-publisher validate

      - name: Authenticate with GitHub OIDC
        if: steps.registry_state.outputs.already_published != 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        if: steps.registry_state.outputs.already_published != 'true'
        run: ./mcp-publisher publish
